{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-7">

        <div class="card shadow">

            <div class="card-body">

                <h2>
                    My Profile
                </h2>

                <hr>

                <p>
                    <strong>Username:</strong>
                    {{ user.username }}
                </p>

                <p>

                    <strong>Role:</strong>

                    {% if user.role %}
                        {{ user.role.name }}
                    {% else %}
                        Not assigned
                    {% endif %}

                </p>

                <hr>

                <form method="POST">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Update Profile
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
